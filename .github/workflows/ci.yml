name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - 3.x
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [check-cs, phpstan, test]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer run ${{ matrix.check }}
